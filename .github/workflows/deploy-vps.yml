name: Deploy to DigitalOcean VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digitalocean-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Write production env file
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          if [[ -n "$PRODUCTION_ENV_FILE" ]]; then
            printf '%s\n' "$PRODUCTION_ENV_FILE" > .env.production
          fi

      - name: Deploy via PM2 on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || secrets.VPS_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
          PM2_APP_NAME: ${{ vars.PM2_APP_NAME || secrets.PM2_APP_NAME }}
          APP_PORT: ${{ vars.APP_PORT || secrets.APP_PORT }}
          APP_HOST: ${{ vars.APP_HOST || secrets.APP_HOST }}
          EXPECTED_NODE_VERSION: ${{ vars.EXPECTED_NODE_VERSION || secrets.EXPECTED_NODE_VERSION }}
        run: |
          chmod +x deploy-vps.sh
          ./deploy-vps.sh
